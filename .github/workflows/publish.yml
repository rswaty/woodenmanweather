name: Update & Publish Dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These fire ~5:05 AM and ~5:05 PM US Eastern during EDT
    # (UTC−4). During EST (UTC−5) that is ~4:05 AM/PM — closest stable pair.
    - cron: "5 9,21 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "_freeze/**"
      - "README.md"
      - "BUSINESS_PLAN.md"
      - "mockups/**"

permissions:
  contents: write

env:
  TZ: America/Detroit

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render dashboard
        run: |
          rm -rf _freeze/index
          quarto render

      - name: Commit and push updates if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Always refresh the dashboard stamp path so scheduled runs publish
          # even when climate caches are unchanged.
          git add docs/ _freeze/ data/
          if git diff --staged --quiet; then
            echo "No changes detected to publish."
            echo "Render outputs were identical to HEAD (unexpected for a fresh stamp)."
          else
            git commit -m "Automated dashboard data update [skip ci]"
            git push
          fi
