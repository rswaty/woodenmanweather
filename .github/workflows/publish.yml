name: Update & Publish Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (8:00 AM EDT)
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "_freeze/**"
      - "README.md"
      - "BUSINESS_PLAN.md"
      - "mockups/**"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render dashboard
        run: |
          quarto render

      - name: Commit and push updates if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ _freeze/ data/
          if git diff --staged --quiet; then
            echo "No changes detected to publish."
          else
            git commit -m "Automated dashboard data update [skip ci]"
            git push
          fi
